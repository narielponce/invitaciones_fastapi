services:
  db:
    image: mariadb:10.6
    container_name: mariadb_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: '${MARIADB_ROOT_PASSWORD}'
      MARIADB_DATABASE: '${MARIADB_DATABASE}'
      MARIADB_USER: '${MARIADB_USER}'
      MARIADB_PASSWORD: '${MARIADB_PASSWORD}'
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  backend:
    image: ghcr.io/narielponce/tufiesta-backend:latest
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=mysql+aiomysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    depends_on:
      - db
    networks:
      app-network:
        aliases:
          - tufiesta-backend

  frontend:
    image: ghcr.io/narielponce/tufiesta-frontend:latest
    container_name: vue_frontend
    restart: unless-stopped
    # Ya no exponemos el puerto directo porque Traefik se encarga del enrutamiento
    # ports:
    #   - "8081:80"
    networks:
      - app-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.tufiesta.rule=Host(`tufiestaonline.com.ar`) || Host(`www.tufiestaonline.com.ar`)"
      - "traefik.http.routers.tufiesta.entrypoints=web,websecure"
      - "traefik.http.routers.tufiesta.tls.certresolver=letsencrypt" # Revisa este nombre en tu servidor Traefik
      - "traefik.http.services.tufiesta.loadbalancer.server.port=80"

networks:
  app-network:
    driver: bridge
  traefik-network:
    external: true

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
